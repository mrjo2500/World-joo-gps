<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, clock;
let lastT = performance.now();
let points = 0;

// --- Helpers
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const updateTime = () => {
  const time = Math.floor((performance.now() - lastT) / 1000);
  document.getElementById('dispTime').innerText = `${Math.floor(time / 60)}:${time % 60 < 10 ? '0' : ''}${time % 60}`;
};

// --- State
const state = {
  armed:false,
  turbo:false,
  camMode:0, 
  pos:new THREE.Vector3(0, 90, 0),
  vel:new THREE.Vector3(0, 0, 0),
  link:100
};

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();
  
  createCity();
  animate();
}

function createCity() {
  const groundGeo = new THREE.PlaneGeometry(4000, 4000);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f2a14 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  for (let i = 0; i < 50; i++) {
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(20, Math.random() * 50 + 10, 20),
      new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff })
    );
    building.position.set(Math.random() * 200 - 100, building.geometry.parameters.height / 2, Math.random() * 200 - 100);
    scene.add(building);
  }
}

function animate() {
  requestAnimationFrame(animate);
  updateTime();
  renderer.render(scene, camera);
}

init();
</script>
</body>
