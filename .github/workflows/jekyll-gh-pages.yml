      <div class="tele-card"><div class="tele-label">AIRSPEED</div><div class="tele-value" id="dispSpd">0.0 كم/س</div></div>
      <div class="tele-card"><div class="tele-label">LINK</div><div class="tele-value" id="dispLink">100</div></div>
      <div class="tele-card"><div class="tele-label">الوقت</div><div class="tele-value" id="dispTime">0:00</div></div>
      <div class="tele-card"><div class="tele-label">النقاط</div><div class="tele-value" id="dispPoints">0</div></div>
    </div>
